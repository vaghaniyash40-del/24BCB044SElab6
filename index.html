<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse a balanced 30-day Indian hostel menu that repeats throughout the year."
    />
    <meta name="theme-color" content="#f7f7f2" />
    <title>Mess Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Mess Menu home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>mess<span class="brand-light">menu</span></span>
        </a>
        <span class="cycle-badge">30 DAY ROTATING MENU</span>
      </header>

      <main>
        <section class="student-view" id="student-view">
          <div class="intro">
            <p class="eyebrow"><span class="status-dot"></span> YOUR DAILY SERVING</p>
            <h1>Good food,<br /><span>good day.</span></h1>
            <p class="intro-copy">
              A homestyle Indian hostel menu, planned for 30 days and repeated all year.
              Pick any date to see what's cooking.
            </p>
          </div>

          <section class="menu-layout" aria-label="Daily menu">
            <div class="calendar-card card">
              <div class="calendar-heading">
                <div>
                  <p class="card-kicker">PICK A DATE</p>
                  <h2 id="calendar-month">Loading…</h2>
                </div>
                <div class="calendar-controls">
                  <button class="icon-button" id="previous-month" type="button" aria-label="Previous month">‹</button>
                  <button class="icon-button" id="next-month" type="button" aria-label="Next month">›</button>
                </div>
              </div>
              <div class="calendar-grid" id="calendar-grid" aria-label="Calendar"></div>
              <button class="today-button" id="go-today" type="button">Jump to today <span>→</span></button>
            </div>

            <section class="day-menu" aria-live="polite">
              <div class="selected-day-heading">
                <div>
                  <p class="card-kicker">THE MENU FOR</p>
                  <h2 id="selected-date-label">Today</h2>
                  <p class="cycle-day" id="cycle-day"></p>
                </div>
                <span class="menu-sparkle" aria-hidden="true">✳</span>
              </div>
              <div id="menu-content"></div>
            </section>
          </section>
        </section>
      </main>

      <footer>
        <span>Made for good days & full plates.</span>
        <span class="footer-mark">MM · <span id="footer-year"></span></span>
      </footer>
    </div>
  </body>
</html>
